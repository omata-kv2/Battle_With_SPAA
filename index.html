<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>Cooking With SPAA</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./js/libs/three.module.js"}}</script>
</head>
<body>
<div id="game" class="not-loaded">
  <canvas id="scene"></canvas>
  <div id="lookSurface" aria-label="視点操作エリア"></div>
  <div id="hud">
    <header><div class="logo">COOKING <i>WITH</i> SPAA</div><div class="stats"><span>WAVE <b id="wave">1 / 5</b></span><span>TARGETS <b id="remaining">0</b></span><span>PEACE <b id="peace">100%</b></span></div></header>
    <div id="announce">WORLD PEACE DEFENSE SYSTEM</div><div id="reticle">+</div>
    <div id="controls"><div class="look-hint">画面全体をドラッグして視点操作（操作ボタンを除く）</div><div id="stick" aria-label="移動スティック"><div id="stickKnob"></div></div><div class="right-controls"><button id="fire">PULSE</button></div></div>
  </div>
</div>
<div id="overlay" class="visible">
  <!-- ホーム画面: 右上にゴールド表示欄（端にピッタリ） -->
  <div id="homeGoldDisplay">ゴールド: <span id="goldVal">0</span> G</div>
  
  <div class="panel">
    <div class="eyebrow">WORLD PEACE DEFENSE PROJECT</div>
    <h1>COOKING<br>WITH SPAA</h1>
    <p id="overlayText">空から来る謎の飛翔体を、エネルギーパルスで迎撃しよう。</p>
    
    <!-- キャラクター選択ボタン (形だけ・機能なし) -->
    <button id="charSelectBtn" class="sub-btn">キャラクター選択</button>

    <!-- ステージ選択欄 (「←」「ステージ選択:ステージ名」「→」) -->
    <div id="stageSelectContainer">
      <button id="prevStage">&larr;</button>
      <span id="stageNameLabel">ステージ選択: 第1ステージ</span>
      <button id="nextStage">&rarr;</button>
    </div>

    <div id="loadArea" class="hidden">
      <div class="loadbar"><div id="loadFill"></div></div>
      <small id="loadText">準備待機中</small>
    </div>
    
    <!-- GAME STARTボタンは画面下端の中央付近（パネル内下部） -->
    <button id="start">GAME START</button>
    <small class="tips">PC：マウス視点 / WASD移動 / Space発射<br>タッチ：左スティックで移動 / 画面全体をドラッグして視点 / PULSEで発射</small>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
