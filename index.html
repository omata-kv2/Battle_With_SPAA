<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>Cooking With SPAA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
 <canvas id="scene"></canvas>
 <div id="hud">
  <header><div class="logo">COOKING <i>WITH</i> SPAA</div>
   <div class="stats"><span>WAVE <b id="wave">1 / 5</b></span><span>TARGETS <b id="remaining">0</b></span><span>PEACE <b id="peace">100%</b></span></div>
  </header>
  <div id="announce">WORLD PEACE DEFENSE SYSTEM</div>
  <div id="reticle">+</div>
  <div id="controls">
   <div class="look-hint">左側の画面をドラッグして視点操作</div>
   <div class="right-controls">
    <div class="move-pad">
     <button data-move="forward">▲</button>
     <div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
    </div>
    <button id="fire">PULSE</button>
   </div>
  </div>
 </div>
 <div id="overlay" class="visible">
  <div class="panel">
   <div class="eyebrow">WORLD PEACE DEFENSE PROJECT</div>
   <h1>COOKING<br>WITH SPAA</h1>
   <p id="overlayText">空から来る謎の飛翔体を、エネルギーパルスで迎撃しよう。</p>
   <div id="loadArea" class="hidden"><div class="loadbar"><div id="loadFill"></div></div><small id="loadText">準備中… 0%</small></div>
   <button id="start">START DEFENSE</button>
   <small class="tips">PC：マウスで視点 / WASDで移動 / クリックで発射<br>タッチ：左側約2/3をドラッグして視点 / 右側のボタンで移動・発射</small>
  </div>
 </div>
</div>
<script>
/* Independent menu handler: remains responsive even if the 3D library fails to load. */
window.__spaaStartRequested=false;
document.addEventListener('DOMContentLoaded',()=>{
 const b=document.getElementById('start');
 b.addEventListener('click',()=>{
  if(window.__spaaStartRequested)return;
  window.__spaaStartRequested=true;
  b.disabled=true;b.textContent='LOADING…';
  document.getElementById('loadArea').classList.remove('hidden');
  document.getElementById('overlayText').textContent='ゲームデータを準備しています。';
  window.dispatchEvent(new Event('spaa-start-request'));
 });
});
</script>
<script type="module" src="game.js"></script>
</body></html>
