<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cooking With SPAA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="hud-top">
      <div class="brand">COOKING <span>WITH</span> SPAA</div>
      <div class="stats">
        <div>WAVE <b id="wave">1 / 5</b></div>
        <div>REMAINING <b id="remaining">0</b></div>
        <div>WORLD PEACE <b id="peace">100%</b></div>
      </div>
    </div>
    <div id="message">WORLD PEACE DEFENSE SYSTEM</div>
    <div class="hud-bottom">
      <div class="help">画面をタップ／クリックして、空に浮かぶターゲットを消そう</div>
      <button id="fire">ENERGY PULSE</button>
    </div>
  </div>
  <div id="overlay" class="show">
    <div class="panel">
      <div class="eyebrow">WORLD PEACE DEFENSE PROJECT</div>
      <h1>COOKING<br>WITH SPAA</h1>
      <p>空からやってくる謎の飛翔体を、エネルギーパルスで迎撃しよう。</p>
      <p class="small">全5ウェーブ。ターゲットを逃すと世界平和ゲージが減少します。</p>
      <button id="start">START DEFENSE</button>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
